<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Salariômetro CSM - Onfly</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; padding: 0; background: #F8F9FB; }
    select, input, button { font-family: 'Outfit', sans-serif; }
    input::placeholder { color: #9CA3AF; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useCallback, useEffect } = React;

    // ============================================================
    // CONFIGURAÇÃO
    // ============================================================
    const SHEETS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRPb1LU5munaaNXrUz2hCdgeUycwiQUT5U3biAkLychCmCafCi3Nraospz7CqYDpnswhAjmOuNJcDFe/pub?gid=1853942289&single=true&output=csv";

    // Meses disponíveis — espelha o array MESES do script v2
    const FILTER_MONTHS = [
      { ym:"2026-01", label:"Janeiro/2026",   ano:2026, mes:1,  dias:20, lastDay:"2026-01-31" },
      { ym:"2026-02", label:"Fevereiro/2026", ano:2026, mes:2,  dias:17, lastDay:"2026-02-28" },
      { ym:"2026-03", label:"Março/2026",     ano:2026, mes:3,  dias:22, lastDay:"2026-03-31" },
      { ym:"2026-04", label:"Abril/2026",     ano:2026, mes:4,  dias:19, lastDay:"2026-04-30" },
      { ym:"2026-05", label:"Maio/2026",      ano:2026, mes:5,  dias:20, lastDay:"2026-05-31" },
    ];

    const CSMS = ["alan.sousa","alexandre.marques","alexsander.coelho","amanda.alves","ana.carolina","ana.gabriela","ana.vieira","analia.soares","andre.salles","anna.luiza","anny.caroline","barbara.felizardo","bethania.dias","brenda.reis","brenda.rodrigues","carla.jesus","charlene.rocha","chaynara.nascimento","daniel.massara","denise.vale","eduarda.sampaio","fabio.agoha","fernanda.lima","flavia.moreira","gabriel.tavares","gabriela.bastos","gabriela.maia","gabriela.pio","gabriella.gomes","giovana.torres","giulia.huoya","gustavo.siroti","hugo.moreira","hugo.pereira","ingrid.demaria","jessica.castro","jessica.moreira","jessica.pires","jonathan.andrada","julia.caroline","karen.barreto","karoline.rodrigues","larissa.amorim","leonardo.leite","luciana.rocha","luisa.santos","marcelo.henrique","maria.eduarda","maria.fernandes","mariana.simoes","mariana.vianna","marina.miranda","matheus.favorito","mayara.borges","michele.sates","michelle.carmo","milene.oliveira","natalia.maia","nathalia.martins","pamela.pereira","patricia.noguchi","paula.evelyn","pedro.maia","rafael.basilio","rafaela","remmo.martini","rhaller.duarte","ronara.guedes","samela.pereira","shayenne.penha","soraia.rodrigues","sthefanie.guedes","taina","tatiana.silva","thays.silva","thiago.rici","tiago.oliveira","vanessa.moreno","victor.silva","vitoria.oliveira","william.carvalho","wynara.xisto"].map(u=>`${u}@onfly.com.br`);

    // ============================================================
    // HELPERS
    // ============================================================
    const getFaixa   = sf => sf>=8?{label:"Faixa 3",teto:5000}:sf>=5?{label:"Faixa 2",teto:3000}:{label:"Faixa 1",teto:2000};
    const faixaColor = l  => l==="Faixa 3"?"#0A8A5E":l==="Faixa 2"?"#B07A00":"#CC2A2A";
    const scoreColor = v  => v>=7.5?"#0A8A5E":v>=4?"#B07A00":"#CC2A2A";
    const pctColor   = v  => v>=100?"#0A8A5E":v>=70?"#B07A00":"#CC2A2A";
    const fmtBRL     = v  => (+v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
    const fmtM       = v  => v>=1e6?`R$ ${(v/1e6).toFixed(1)}M`:v>=1000?`R$ ${(v/1000).toFixed(0)}k`:fmtBRL(v);
    const fmtName    = e  => e.split("@")[0].replace("."," ").replace(/\b\w/g,l=>l.toUpperCase());

    const PILLARS = [
      { key:"score_satisfacao",    label:"Satisfação",    color:"#2563EB", icon:"◎" },
      { key:"score_producao",      label:"Produção",      color:"#0A8A5E", icon:"◈" },
      { key:"score_dilatacao",     label:"Dilatação",     color:"#B07A00", icon:"◆" },
      { key:"score_rentabilidade", label:"Rentabilidade", color:"#7C3AED", icon:"◉" },
    ];

    const TABS = [
      { k:"overview",    l:"Visão Geral"  },
      { k:"scores",      l:"Scores"       },
      { k:"metas",       l:"Meta & GMV"   },
      { k:"projecao",    l:"Projeção"     },
      { k:"remuneracao", l:"Remuneração"  },
    ];

    // ============================================================
    // PARSE CSV
    // ============================================================
    const parseCSV = (text) => {
      const lines = text.trim().split("\n");
      const headers = lines[0].split(",").map(h => h.trim().replace(/^"|"$/g,""));
      return lines.slice(1).map(line => {
        const vals = [];
        let cur = "", inQ = false;
        for (let i=0; i<line.length; i++) {
          const c = line[i];
          if (c==='"') { inQ=!inQ; }
          else if (c==="," && !inQ) { vals.push(cur); cur=""; }
          else { cur+=c; }
        }
        vals.push(cur);
        const obj = {};
        headers.forEach((h,i) => { obj[h] = (vals[i]||"").trim().replace(/^"|"$/g,""); });
        return obj;
      });
    };

    // Normaliza yearmonth para YYYY-MM independente do formato que vem da planilha
    const normalizeYM = (v) => {
      if (!v) return "";
      v = v.trim().replace(/^'/,"");
      if (/^\d{4}-\d{2}$/.test(v)) return v;
      try {
        const d = new Date(v);
        if (!isNaN(d)) return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
      } catch(e){}
      return v;
    };

    // ============================================================
    // ENRICH — calcula campos derivados a partir do CSV v2
    // Colunas novas do v2: classificacao_contrato, elegivel_meta
    // ============================================================
    const enrich = rows => rows.map(r => {
      const sf  = +r.score_final || Math.round(((+r.score_satisfacao + +r.score_producao + +r.score_dilatacao + +r.score_rentabilidade)/4)*100)/100;
      const pct = +r.meta ? Math.round((+r.realizado / +r.meta)*1000)/10 : 0;
      const f   = getFaixa(sf);
      const pot = Math.round(f.teto * (+r.cota_part||0) / 100 * 100) / 100;
      return {
        ...r,
        // Scores
        score_final:          sf,
        score_satisfacao:     +r.score_satisfacao    || 0,
        score_producao:       +r.score_producao      || 0,
        score_dilatacao:      +r.score_dilatacao     || 0,
        score_rentabilidade:  +r.score_rentabilidade || 0,
        // Meta
        meta:       +r.meta     || 0,
        realizado:  +r.realizado|| 0,
        cota_part:  +r.cota_part|| 0,
        pct,
        // Remuneração
        faixa:        f.label,
        teto:         f.teto,
        potencial:    pot,
        desbloqueada: pct >= 100 ? pot : 0,
        // Hierarquia
        papel_hierarquia: r.papel_hierarquia || "Mae",
        id_mae:           +r.id_mae || +r.id_onfly,
        // Projeção
        gmv_acumulado:        +r.gmv_acumulado        || 0,
        dias_uteis_decorridos:+r.dias_uteis_decorridos || 0,
        dias_uteis_restantes: +r.dias_uteis_restantes  || 0,
        ritmo_diario:         +r.ritmo_diario          || 0,
        projecao_gmv:         +r.projecao_gmv          || 0,
        // Colunas novas v2
        classificacao_contrato: r.classificacao_contrato || "—",
        elegivel_meta:          r.elegivel_meta          || "nao",
      };
    });

    // ============================================================
    // COMPONENTES
    // ============================================================
    const ScoreRing = ({value, color, size=44}) => {
      const r=size/2-4, circ=2*Math.PI*r, pct=Math.min(1,value/10);
      return (
        <svg width={size} height={size}>
          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#E5E7EB" strokeWidth="3"/>
          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth="3"
            strokeDasharray={`${pct*circ} ${circ}`} strokeLinecap="round"
            transform={`rotate(-90 ${size/2} ${size/2})`}/>
          <text x={size/2} y={size/2+1} textAnchor="middle" dominantBaseline="middle"
            fontSize={size>40?11:9} fontWeight="600" fill={color}>{value.toFixed(1)}</text>
        </svg>
      );
    };

    const ProgressBar = ({value, color, h=4}) => (
      <div style={{background:"#F3F4F6",borderRadius:99,height:h,overflow:"hidden"}}>
        <div style={{width:`${Math.min(100,(value/10)*100)}%`,height:"100%",background:color,borderRadius:99}}/>
      </div>
    );

    const PctBar = ({pct, h=5}) => (
      <div style={{background:"#F3F4F6",borderRadius:99,height:h,overflow:"hidden"}}>
        <div style={{width:`${Math.min(100,pct)}%`,height:"100%",background:pctColor(pct),borderRadius:99}}/>
      </div>
    );

    const StatCard = ({label, value, color, accent}) => (
      <div style={{background:"#fff",border:"1px solid #E5E7EB",borderRadius:12,padding:"14px 16px",position:"relative",overflow:"hidden",boxShadow:"0 1px 3px rgba(0,0,0,0.04)"}}>
        {accent && <div style={{position:"absolute",top:0,left:0,right:0,height:2,background:accent}}/>}
        <p style={{margin:0,fontSize:11,fontWeight:500,color:"#9CA3AF",letterSpacing:"0.06em",textTransform:"uppercase"}}>{label}</p>
        <p style={{margin:"6px 0 0",fontSize:20,fontWeight:700,color:color||"#111827",letterSpacing:"-0.02em"}}>{value}</p>
      </div>
    );

    const ClassifBadge = ({value}) => {
      const color = value==="Old"?"#6B7280":value==="NEW"?"#2563EB":value.startsWith("INTERS")?"#B07A00":"#9CA3AF";
      return (
        <span style={{display:"inline-block",fontSize:9,fontWeight:700,padding:"1px 5px",borderRadius:99,
          background:`${color}18`,color,border:`1px solid ${color}44`}}>{value}</span>
      );
    };

    // ============================================================
    // APP
    // ============================================================
    function App() {
      const mesAtual = FILTER_MONTHS.find(m => {
        const hoje = new Date();
        return m.ano === hoje.getFullYear() && m.mes === hoje.getMonth()+1;
      }) || FILTER_MONTHS[FILTER_MONTHS.length-1];

      const [tab,        setTab]        = useState("overview");
      const [csm,        setCsm]        = useState(CSMS[0]);
      const [mesFilter,  setMesFilter]  = useState(mesAtual.ym);
      const [data,       setData]       = useState([]);
      const [loading,    setLoading]    = useState(false);
      const [error,      setError]      = useState(null);
      const [loaded,     setLoaded]     = useState(false);
      const [search,     setSearch]     = useState("");
      const [sk,         setSk]         = useState("score_final");
      const [sd,         setSd]         = useState(-1);
      const [sel,        setSel]        = useState(null);

      const tgl = k => { if(sk===k) setSd(d=>d*-1); else { setSk(k); setSd(-1); } };
      const si  = k => sk===k ? (sd===-1?"↓":"↑") : "";

      const load = useCallback(async(email, ym) => {
        const mf = FILTER_MONTHS.find(m => m.ym === (ym||mesFilter)) || mesAtual;
        setLoading(true); setError(null); setLoaded(false); setSel(null);
        try {
          const res = await fetch(SHEETS_CSV_URL);
          if (!res.ok) throw new Error("Erro ao carregar planilha: "+res.status);
          const text = await res.text();
          const all  = parseCSV(text);

          const filtered = all.filter(r =>
            r.cs_responsible_email &&
            r.cs_responsible_email.trim() === email.trim() &&
            normalizeYM(r.yearmonth) === mf.ym
          );

          if (filtered.length === 0) {
            const mesesDisp = [...new Set(all.map(r => normalizeYM(r.yearmonth)))].sort().join(", ");
            throw new Error(`Nenhum dado para ${email} em ${mf.label}. Meses disponíveis: ${mesesDisp}`);
          }

          setData(enrich(filtered));
          setLoaded(true);
        } catch(e) {
          setError(e.message);
        } finally {
          setLoading(false);
        }
      }, [mesFilter]);

      const rows = [...data]
        .filter(r => r.empresa_nome?.toLowerCase().includes(search.toLowerCase()))
        .sort((a,b) => ((b[sk]??0)-(a[sk]??0))*sd);

      const tMeta    = data.reduce((s,r) => s+r.meta,     0);
      const tReal    = data.reduce((s,r) => s+r.realizado, 0);
      const tPct     = tMeta ? Math.round((tReal/tMeta)*1000)/10 : 0;
      const tPot     = data.reduce((s,r) => s+r.potencial,    0);
      const tDesbloq = data.reduce((s,r) => s+r.desbloqueada, 0);
      const avg      = k => data.length ? (data.reduce((s,r)=>s+(+r[k]||0),0)/data.length).toFixed(2) : "—";

      const S = {
        root:   { minHeight:"100vh",background:"#F8F9FB",color:"#111827",fontFamily:"'Outfit',sans-serif",paddingBottom:40 },
        hdr:    { background:"#fff",borderBottom:"1px solid #E5E7EB",padding:"12px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8,position:"sticky",top:0,zIndex:100,boxShadow:"0 1px 4px rgba(0,0,0,0.05)" },
        sel:    { background:"#F3F4F6",border:"1px solid #D1D5DB",borderRadius:8,color:"#374151",fontSize:12,padding:"6px 10px",cursor:"pointer",outline:"none" },
        btn:    { background:"linear-gradient(135deg,#2563EB,#7C3AED)",border:"none",borderRadius:8,color:"#fff",fontSize:12,fontWeight:600,padding:"6px 14px",cursor:"pointer" },
        tabs:   { display:"flex",gap:2,padding:"12px 16px 0",borderBottom:"1px solid #E5E7EB" },
        tabBtn: a => ({ background:"transparent",border:"none",color:a?"#111827":"#9CA3AF",fontSize:12,fontWeight:a?600:400,padding:"7px 12px",cursor:"pointer",borderBottom:a?"2px solid #2563EB":"2px solid transparent",marginBottom:-1 }),
        body:   { padding:"0 16px" },
        grid:   c => ({ display:"grid",gridTemplateColumns:`repeat(auto-fit,minmax(${c||120}px,1fr))`,gap:8,marginBottom:16 }),
        st:     { fontSize:10,fontWeight:600,letterSpacing:"0.08em",textTransform:"uppercase",color:"#9CA3AF",marginBottom:8,marginTop:16 },
        wrap:   { border:"1px solid #E5E7EB",borderRadius:12,overflow:"hidden",background:"#fff" },
        tbl:    { width:"100%",borderCollapse:"collapse",fontSize:12 },
        th:     a => ({ padding:"9px 10px",textAlign:"center",fontWeight:600,fontSize:10,letterSpacing:"0.04em",textTransform:"uppercase",color:a?"#111827":"#6B7280",cursor:"pointer",background:"#F9FAFB",userSelect:"none",whiteSpace:"nowrap" }),
        thL:    { padding:"9px 12px",textAlign:"left",fontWeight:600,fontSize:10,letterSpacing:"0.04em",textTransform:"uppercase",color:"#6B7280",background:"#F9FAFB" },
        td:     { padding:"10px 10px",borderTop:"1px solid #F3F4F6",verticalAlign:"middle",textAlign:"center" },
        tdL:    { padding:"10px 12px",borderTop:"1px solid #F3F4F6",verticalAlign:"middle" },
        inp:    { width:"100%",background:"#fff",border:"1px solid #D1D5DB",borderRadius:8,color:"#111827",fontSize:12,padding:"8px 12px",outline:"none",marginBottom:12,boxSizing:"border-box" },
        badge:  c => ({ display:"inline-block",fontSize:10,fontWeight:700,padding:"2px 7px",borderRadius:99,background:`${c}18`,color:c,border:`1px solid ${c}44` }),
        tf:     { background:"#F9FAFB",fontWeight:700 },
      };

      return (
        <div style={S.root}>
          <style>{`@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap');`}</style>

          {/* HEADER */}
          <div style={S.hdr}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <div style={{width:26,height:26,borderRadius:6,background:"linear-gradient(135deg,#2563EB,#7C3AED)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:800,color:"#fff"}}>✦</div>
              <div>
                <p style={{margin:0,fontSize:14,fontWeight:700,color:"#111827"}}>
                  {loaded ? fmtName(csm) : "Salariômetro CSM"}
                </p>
                <p style={{margin:0,fontSize:11,color:"#9CA3AF"}}>
                  {(FILTER_MONTHS.find(m=>m.ym===mesFilter)||mesAtual).label}
                  {loaded ? ` · ${data.length} empresas` : ""}
                </p>
              </div>
            </div>
            <div style={{display:"flex",gap:6,alignItems:"center"}}>
              <select value={mesFilter} onChange={e=>{setMesFilter(e.target.value);setLoaded(false);}} style={{...S.sel,fontWeight:600}}>
                {FILTER_MONTHS.map(m=><option key={m.ym} value={m.ym}>{m.label}</option>)}
              </select>
              <select value={csm} onChange={e=>setCsm(e.target.value)} style={S.sel}>
                {CSMS.map(c=><option key={c} value={c}>{c.split("@")[0]}</option>)}
              </select>
              <button onClick={()=>load(csm,mesFilter)} disabled={loading} style={{...S.btn,opacity:loading?0.5:1}}>
                {loading ? "Carregando…" : loaded ? "↺ Atualizar" : "↗ Carregar"}
              </button>
            </div>
          </div>

          {/* ESTADOS */}
          {error && (
            <div style={{margin:"12px 16px",padding:"10px 14px",background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:8,color:"#DC2626",fontSize:12}}>
              ⚠ {error}
            </div>
          )}
          {loading && (
            <div style={{textAlign:"center",padding:"3rem 0",color:"#9CA3AF",fontSize:12}}>
              Carregando dados…
            </div>
          )}
          {!loading && !loaded && !error && (
            <div style={{textAlign:"center",padding:"3rem 0",color:"#9CA3AF",fontSize:12}}>
              Selecione um CSM e mês, depois clique em Carregar
            </div>
          )}

          {/* CONTEÚDO */}
          {loaded && !loading && (<>
            <div style={S.tabs}>
              {TABS.map(t=>(
                <button key={t.k} onClick={()=>{setTab(t.k);setSel(null);}} style={S.tabBtn(tab===t.k)}>{t.l}</button>
              ))}
            </div>

            <div style={S.body}>
              <div style={{height:16}}/>

              {/* ── VISÃO GERAL ── */}
              {tab==="overview" && (<>
                <div style={S.grid(120)}>
                  <StatCard label="Score médio"       value={avg("score_final")}  color={scoreColor(parseFloat(avg("score_final")))} accent="#2563EB"/>
                  <StatCard label="GMV realizado"     value={fmtM(tReal)}         accent="#0A8A5E"/>
                  <StatCard label="Atingimento"       value={`${tPct}%`}          color={pctColor(tPct)} accent={pctColor(tPct)}/>
                  <StatCard label="Rem. desbloqueada" value={fmtBRL(tDesbloq)}    color="#0A8A5E" accent="#0A8A5E"/>
                  <StatCard label="Rem. potencial"    value={fmtBRL(tPot)}        accent="#7C3AED"/>
                </div>

                <p style={S.st}>Ranking por score final</p>
                <div style={S.wrap}>
                  <div style={{display:"flex",alignItems:"center",gap:12,padding:"7px 14px",background:"#F9FAFB",borderBottom:"1px solid #E5E7EB"}}>
                    <span style={{minWidth:16}}/>
                    <div style={{flex:1,fontSize:10,fontWeight:600,color:"#6B7280",letterSpacing:"0.05em",textTransform:"uppercase"}}>Empresa</div>
                    <div style={{fontSize:10,fontWeight:600,color:"#6B7280",letterSpacing:"0.05em",textTransform:"uppercase",minWidth:68,textAlign:"center"}}>Score</div>
                  </div>
                  {[...data].sort((a,b)=>b.score_final-a.score_final).map((r,i)=>(
                    <div key={r.id_onfly} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 14px",borderTop:"1px solid #F3F4F6"}}>
                      <span style={{fontSize:10,fontWeight:700,color:"#D1D5DB",minWidth:16}}>#{i+1}</span>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:2,flexWrap:"wrap"}}>
                          <p style={{margin:0,fontSize:12,fontWeight:500,color:"#111827",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.empresa_nome}</p>
                          {r.papel_hierarquia==="Filha" && <span style={{fontSize:9,fontWeight:700,padding:"1px 5px",borderRadius:99,background:"#EDE9FE",color:"#7C3AED",border:"1px solid #DDD6FE",flexShrink:0}}>Grupo</span>}
                          {r.papel_hierarquia==="Mae" && data.some(x=>x.papel_hierarquia==="Filha"&&+x.id_mae===+r.id_onfly) && <span style={{fontSize:9,fontWeight:700,padding:"1px 5px",borderRadius:99,background:"#DBEAFE",color:"#1D4ED8",border:"1px solid #BFDBFE",flexShrink:0}}>Matriz</span>}
                          <ClassifBadge value={r.classificacao_contrato}/>
                        </div>
                        <div style={{display:"flex",gap:8,marginTop:2,flexWrap:"wrap"}}>
                          {PILLARS.map(p=>(
                            <span key={p.key} style={{fontSize:10,color:"#9CA3AF"}}>
                              {p.icon} <span style={{color:p.color,fontWeight:600}}>{(+r[p.key]).toFixed(1)}</span>
                            </span>
                          ))}
                        </div>
                      </div>
                      <div style={{textAlign:"right",minWidth:68}}>
                        <ScoreRing value={r.score_final} color={scoreColor(r.score_final)} size={42}/>
                        <span style={S.badge(faixaColor(r.faixa))}>{r.faixa}</span>
                      </div>
                    </div>
                  ))}
                </div>
              </>)}

              {/* ── SCORES ── */}
              {tab==="scores" && (<>
                <div style={S.grid(110)}>
                  {[{label:"Score Final",key:"score_final",color:"#111827"},...PILLARS].map(m=>(
                    <StatCard key={m.key} label={m.label} value={avg(m.key)} color={scoreColor(parseFloat(avg(m.key)))} accent={m.color||"#2563EB"}/>
                  ))}
                </div>
                <input placeholder="Buscar empresa…" value={search} onChange={e=>setSearch(e.target.value)} style={S.inp}/>
                <div style={S.wrap}>
                  <table style={S.tbl}>
                    <thead>
                      <tr>
                        <th style={{...S.thL,width:"28%"}}>Empresa</th>
                        {PILLARS.map(p=><th key={p.key} onClick={()=>tgl(p.key)} style={S.th(sk===p.key)}>{p.icon} {p.label} {si(p.key)}</th>)}
                        <th onClick={()=>tgl("score_final")} style={S.th(sk==="score_final")}>Final {si("score_final")}</th>
                        <th style={S.th(false)}>Contrato</th>
                      </tr>
                    </thead>
                    <tbody>{rows.map(r=>(
                      <tr key={r.id_onfly} onClick={()=>setSel(sel?.id_onfly===r.id_onfly?null:r)}
                        style={{cursor:"pointer",background:sel?.id_onfly===r.id_onfly?"#EFF6FF":"transparent"}}>
                        <td style={S.tdL}>
                          <span style={{fontSize:10,color:"#9CA3AF",display:"block"}}>#{r.id_onfly}</span>
                          <span style={{color:"#111827",fontWeight:500}}>{r.empresa_nome.length>28?r.empresa_nome.slice(0,28)+"…":r.empresa_nome}</span>
                        </td>
                        {PILLARS.map(p=>(
                          <td key={p.key} style={S.td}>
                            <span style={{fontWeight:600,color:scoreColor(r[p.key]),fontSize:12}}>{(+r[p.key]).toFixed(1)}</span>
                            <ProgressBar value={+r[p.key]} color={p.color} h={3}/>
                          </td>
                        ))}
                        <td style={S.td}><ScoreRing value={r.score_final} color={scoreColor(r.score_final)} size={36}/></td>
                        <td style={S.td}><ClassifBadge value={r.classificacao_contrato}/></td>
                      </tr>
                    ))}</tbody>
                  </table>
                </div>
                {sel && (
                  <div style={{marginTop:12,border:"1px solid #BFDBFE",borderRadius:12,padding:"14px 16px",background:"#EFF6FF"}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:12}}>
                      <div>
                        <p style={{margin:0,fontWeight:600,fontSize:13,color:"#111827"}}>{sel.empresa_nome}</p>
                        <p style={{margin:"2px 0 0",fontSize:11,color:"#6B7280"}}>
                          Score Final: <strong style={{color:scoreColor(sel.score_final)}}>{sel.score_final.toFixed(2)}</strong>
                          {" · "}{sel.faixa}{" · "}<ClassifBadge value={sel.classificacao_contrato}/>
                          {" · "}Elegível meta: <strong>{sel.elegivel_meta}</strong>
                        </p>
                      </div>
                      <button onClick={()=>setSel(null)} style={{background:"#F3F4F6",border:"1px solid #E5E7EB",color:"#6B7280",borderRadius:6,padding:"3px 8px",cursor:"pointer",fontSize:11}}>✕</button>
                    </div>
                    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(120px,1fr))",gap:8}}>
                      {PILLARS.map(p=>(
                        <div key={p.key} style={{background:"#F9FAFB",border:"1px solid #E5E7EB",borderRadius:10,padding:"10px 12px"}}>
                          <p style={{margin:0,fontSize:10,color:"#6B7280",textTransform:"uppercase",letterSpacing:"0.05em"}}>{p.icon} {p.label}</p>
                          <p style={{margin:"6px 0 4px",fontSize:22,fontWeight:700,color:scoreColor(sel[p.key])}}>{(+sel[p.key]).toFixed(2)}</p>
                          <ProgressBar value={+sel[p.key]} color={p.color}/>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </>)}

              {/* ── META & GMV ── */}
              {tab==="metas" && (<>
                <div style={S.grid(120)}>
                  <StatCard label="Meta total"       value={fmtBRL(tMeta)} accent="#2563EB"/>
                  <StatCard label="Realizado"         value={fmtBRL(tReal)} accent="#0A8A5E"/>
                  <StatCard label="Atingimento"       value={`${tPct}%`}    color={pctColor(tPct)} accent={pctColor(tPct)}/>
                  <StatCard label="Empresas na meta"  value={`${data.filter(r=>r.pct>=100).length} / ${data.length}`} accent="#F5A623"/>
                </div>
                <input placeholder="Buscar empresa…" value={search} onChange={e=>setSearch(e.target.value)} style={S.inp}/>
                <div style={S.wrap}>
                  <table style={S.tbl}>
                    <thead>
                      <tr>
                        <th style={{...S.thL,width:"28%"}}>Empresa</th>
                        <th onClick={()=>tgl("meta")}      style={S.th(sk==="meta")}>Meta {si("meta")}</th>
                        <th onClick={()=>tgl("realizado")} style={S.th(sk==="realizado")}>Realizado {si("realizado")}</th>
                        <th onClick={()=>tgl("pct")}       style={{...S.th(sk==="pct"),minWidth:100}}>Atingimento {si("pct")}</th>
                        <th style={S.th(false)}>Cota Part</th>
                        <th style={S.th(false)}>Elegível</th>
                      </tr>
                    </thead>
                    <tbody>{rows.map(r=>(
                      <tr key={r.id_onfly}>
                        <td style={S.tdL}>
                          <span style={{fontSize:10,color:"#9CA3AF",display:"block"}}>#{r.id_onfly}</span>
                          <span style={{color:"#111827",fontWeight:500}}>{r.empresa_nome.length>28?r.empresa_nome.slice(0,28)+"…":r.empresa_nome}</span>
                          <div style={{marginTop:2}}><ClassifBadge value={r.classificacao_contrato}/></div>
                        </td>
                        <td style={{...S.td,color:"#6B7280",fontVariantNumeric:"tabular-nums"}}>{fmtBRL(r.meta)}</td>
                        <td style={{...S.td,fontWeight:600,color:"#111827",fontVariantNumeric:"tabular-nums"}}>{fmtBRL(r.realizado)}</td>
                        <td style={S.td}>
                          <span style={{fontWeight:700,color:pctColor(r.pct),display:"block",marginBottom:3}}>{r.pct}%</span>
                          <PctBar pct={r.pct}/>
                        </td>
                        <td style={{...S.td,color:"#9CA3AF"}}>{r.cota_part}%</td>
                        <td style={S.td}>
                          <span style={{fontSize:10,fontWeight:700,color:r.elegivel_meta==="sim"?"#0A8A5E":"#9CA3AF"}}>
                            {r.elegivel_meta==="sim"?"✓ sim":"✗ não"}
                          </span>
                        </td>
                      </tr>
                    ))}</tbody>
                    <tfoot>
                      <tr style={S.tf}>
                        <td style={{...S.tdL,color:"#111827",fontSize:11}}>TOTAL</td>
                        <td style={{...S.td,color:"#6B7280",fontVariantNumeric:"tabular-nums"}}>{fmtBRL(tMeta)}</td>
                        <td style={{...S.td,fontWeight:700,color:"#111827",fontVariantNumeric:"tabular-nums"}}>{fmtBRL(tReal)}</td>
                        <td style={S.td}>
                          <span style={{fontWeight:700,color:pctColor(tPct),display:"block",marginBottom:3}}>{tPct}%</span>
                          <PctBar pct={tPct}/>
                        </td>
                        <td style={S.td}/><td style={S.td}/>
                      </tr>
                    </tfoot>
                  </table>
                </div>
              </>)}

              {/* ── PROJEÇÃO ── */}
              {tab==="projecao" && (()=>{
                const du    = rows[0]?.dias_uteis_decorridos || 0;
                const dr    = rows[0]?.dias_uteis_restantes  || 0;
                const tProj = rows.reduce((s,r)=>s+r.projecao_gmv, 0);
                const tRitmo= rows.reduce((s,r)=>s+r.ritmo_diario, 0);
                const tAcum = rows.reduce((s,r)=>s+r.gmv_acumulado,0);
                return (<>
                  <div style={S.grid(120)}>
                    <StatCard label="Dias decorridos"    value={`${du} dias`} accent="#2563EB"/>
                    <StatCard label="Dias restantes"     value={`${dr} dias`} accent="#F5A623"/>
                    <StatCard label="GMV acumulado"      value={fmtM(tAcum)}  accent="#0A8A5E"/>
                    <StatCard label="Ritmo diário total" value={fmtM(tRitmo)} accent="#7C3AED"/>
                    <StatCard label="Projeção total"     value={fmtM(tProj)}  color={pctColor((tProj/tMeta)*100)} accent={pctColor((tProj/tMeta)*100)}/>
                    <StatCard label="Proj. vs meta"      value={tMeta?`${Math.round((tProj/tMeta)*100)}%`:"—"} color={pctColor((tProj/tMeta)*100)} accent={pctColor((tProj/tMeta)*100)}/>
                  </div>
                  <input placeholder="Buscar empresa…" value={search} onChange={e=>setSearch(e.target.value)} style={S.inp}/>
                  <div style={S.wrap}>
                    <table style={S.tbl}>
                      <thead>
                        <tr>
                          <th style={{...S.thL,width:"26%"}}>Empresa</th>
                          <th onClick={()=>tgl("gmv_acumulado")} style={S.th(sk==="gmv_acumulado")}>GMV Acumulado {si("gmv_acumulado")}</th>
                          <th onClick={()=>tgl("ritmo_diario")}  style={S.th(sk==="ritmo_diario")}>Ritmo Diário {si("ritmo_diario")}</th>
                          <th style={S.th(false)}>D.U. Restantes</th>
                          <th onClick={()=>tgl("projecao_gmv")}  style={S.th(sk==="projecao_gmv")}>Projeção GMV {si("projecao_gmv")}</th>
                          <th onClick={()=>tgl("meta")}          style={S.th(sk==="meta")}>Meta {si("meta")}</th>
                          <th style={{...S.th(false),minWidth:90}}>Proj. vs Meta</th>
                        </tr>
                      </thead>
                      <tbody>{rows.map(r=>{
                        const projPct = r.meta ? Math.round((r.projecao_gmv/r.meta)*100) : 0;
                        return (
                          <tr key={r.id_onfly}>
                            <td style={S.tdL}>
                              <span style={{fontSize:10,color:"#9CA3AF",display:"block"}}>#{r.id_onfly}</span>
                              <span style={{color:"#111827",fontWeight:500,fontSize:11}}>{r.empresa_nome.length>28?r.empresa_nome.slice(0,28)+"…":r.empresa_nome}</span>
                            </td>
                            <td style={{...S.td,fontWeight:500,color:"#111827",fontVariantNumeric:"tabular-nums"}}>{fmtBRL(r.gmv_acumulado)}</td>
                            <td style={{...S.td,color:"#6B7280",fontVariantNumeric:"tabular-nums"}}>{fmtBRL(r.ritmo_diario)}<span style={{fontSize:9,color:"#9CA3AF",display:"block"}}>/dia</span></td>
                            <td style={{...S.td,color:"#6B7280"}}>{r.dias_uteis_restantes}</td>
                            <td style={{...S.td,fontWeight:700,color:"#111827",fontVariantNumeric:"tabular-nums"}}>{fmtBRL(r.projecao_gmv)}</td>
                            <td style={{...S.td,color:"#6B7280",fontVariantNumeric:"tabular-nums"}}>{fmtBRL(r.meta)}</td>
                            <td style={S.td}>
                              <span style={{fontWeight:700,color:pctColor(projPct),display:"block",marginBottom:3}}>{projPct}%</span>
                              <PctBar pct={projPct}/>
                            </td>
                          </tr>
                        );
                      })}</tbody>
                      <tfoot>
                        <tr style={S.tf}>
                          <td style={{...S.tdL,color:"#111827",fontSize:11}}>TOTAL</td>
                          <td style={{...S.td,fontWeight:500,fontVariantNumeric:"tabular-nums"}}>{fmtBRL(tAcum)}</td>
                          <td style={{...S.td,color:"#6B7280",fontVariantNumeric:"tabular-nums"}}>{fmtBRL(tRitmo)}<span style={{fontSize:9,color:"#9CA3AF",display:"block"}}>/dia</span></td>
                          <td style={S.td}/>
                          <td style={{...S.td,fontWeight:700,fontVariantNumeric:"tabular-nums"}}>{fmtBRL(tProj)}</td>
                          <td style={{...S.td,color:"#6B7280",fontVariantNumeric:"tabular-nums"}}>{fmtBRL(tMeta)}</td>
                          <td style={S.td}>
                            <span style={{fontWeight:700,color:pctColor(Math.round((tProj/tMeta)*100)),display:"block",marginBottom:3}}>{tMeta?Math.round((tProj/tMeta)*100):0}%</span>
                            <PctBar pct={tMeta?Math.round((tProj/tMeta)*100):0}/>
                          </td>
                        </tr>
                      </tfoot>
                    </table>
                  </div>
                  <p style={{marginTop:8,fontSize:11,color:"#9CA3AF"}}>
                    Projeção = GMV acumulado + (ritmo diário × dias úteis restantes) · Dias úteis decorridos excluem sáb/dom
                  </p>
                </>);
              })()}

              {/* ── REMUNERAÇÃO ── */}
              {tab==="remuneracao" && (<>
                <div style={S.grid(120)}>
                  <StatCard label="Potencial total" value={fmtBRL(tPot)}     accent="#7C3AED"/>
                  <StatCard label="Desbloqueada"    value={fmtBRL(tDesbloq)} color={tDesbloq>0?"#0A8A5E":"#CC2A2A"} accent={tDesbloq>0?"#0A8A5E":"#CC2A2A"}/>
                  <StatCard label="% desbloqueado"  value={tPot?`${Math.round((tDesbloq/tPot)*100)}%`:"—"} color={pctColor((tDesbloq/tPot)*100)} accent="#F5A623"/>
                  <StatCard label="Empresas na meta" value={`${data.filter(r=>r.pct>=100).length} / ${data.length}`} accent="#2563EB"/>
                </div>
                <input placeholder="Buscar empresa…" value={search} onChange={e=>setSearch(e.target.value)} style={S.inp}/>
                <div style={S.wrap}>
                  <table style={S.tbl}>
                    <thead>
                      <tr>
                        <th style={{...S.thL,width:"22%"}}>Empresa</th>
                        <th onClick={()=>tgl("score_final")} style={S.th(sk==="score_final")}>Score {si("score_final")}</th>
                        <th style={S.th(false)}>Faixa</th>
                        <th style={S.th(false)}>Teto</th>
                        <th style={S.th(false)}>Cota</th>
                        <th onClick={()=>tgl("potencial")}   style={S.th(sk==="potencial")}>Potencial {si("potencial")}</th>
                        <th style={S.th(false)}>Atingimento</th>
                        <th onClick={()=>tgl("desbloqueada")} style={S.th(sk==="desbloqueada")}>Desbloqueada {si("desbloqueada")}</th>
                      </tr>
                    </thead>
                    <tbody>{rows.map(r=>(
                      <tr key={r.id_onfly}>
                        <td style={S.tdL}>
                          <span style={{fontSize:10,color:"#9CA3AF",display:"block"}}>#{r.id_onfly}</span>
                          <span style={{color:"#111827",fontWeight:500,fontSize:11}}>{r.empresa_nome.length>26?r.empresa_nome.slice(0,26)+"…":r.empresa_nome}</span>
                        </td>
                        <td style={S.td}><ScoreRing value={r.score_final} color={scoreColor(r.score_final)} size={34}/></td>
                        <td style={S.td}><span style={S.badge(faixaColor(r.faixa))}>{r.faixa}</span></td>
                        <td style={{...S.td,fontSize:11,color:"#6B7280",fontVariantNumeric:"tabular-nums"}}>{fmtBRL(r.teto)}</td>
                        <td style={{...S.td,color:"#9CA3AF"}}>{r.cota_part}%</td>
                        <td style={{...S.td,fontWeight:600,color:"#111827",fontSize:11,fontVariantNumeric:"tabular-nums"}}>{fmtBRL(r.potencial)}</td>
                        <td style={S.td}>
                          <span style={{fontWeight:700,color:pctColor(r.pct),display:"block",marginBottom:2,fontSize:11}}>{r.pct}%</span>
                          <PctBar pct={r.pct} h={3}/>
                        </td>
                        <td style={{...S.td,fontWeight:700,fontSize:11,color:r.desbloqueada>0?"#0A8A5E":"#D1D5DB",fontVariantNumeric:"tabular-nums"}}>
                          {r.desbloqueada>0 ? fmtBRL(r.desbloqueada) : "—"}
                        </td>
                      </tr>
                    ))}</tbody>
                    <tfoot>
                      <tr style={S.tf}>
                        <td colSpan={5} style={{...S.tdL,color:"#111827",fontSize:11}}>TOTAL</td>
                        <td style={{...S.td,fontWeight:700,color:"#111827",fontSize:11,fontVariantNumeric:"tabular-nums"}}>{fmtBRL(tPot)}</td>
                        <td style={S.td}/>
                        <td style={{...S.td,fontWeight:700,color:"#0A8A5E",fontSize:11,fontVariantNumeric:"tabular-nums"}}>{fmtBRL(tDesbloq)}</td>
                      </tr>
                    </tfoot>
                  </table>
                </div>
                <p style={{marginTop:8,fontSize:11,color:"#9CA3AF"}}>
                  Faixa 1 (0–4.9): R$ 2.000 · Faixa 2 (5–7.9): R$ 3.000 · Faixa 3 (8–10): R$ 5.000
                </p>
              </>)}

            </div>
          </>)}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
